[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-education"
version = "2.0.0"
description = "Event-sourced learning state engine with zero AI dependencies"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["education", "event-sourcing", "learning-engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "pydantic>=2.0",
    "ollama>=0.4",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "cryptography>=42.0",
    "fastapi>=0.115",
]

[project.scripts]
helix-learn = "helix_education.cli:main"
helix-web = "helix_education.web_server:main"
helix-web-v2 = "helix_education.web_server_v2:main"

[project.urls]
Homepage = "https://github.com/HatemIsmailShalaby1979/Helix-Education"
Repository = "https://github.com/HatemIsmailShalaby1979/Helix-Education"

[tool.setuptools.packages.find]
include = ["state_core*", "learning_service*", "content_engine*", "quiz_engine*", "progress_engine*", "delivery_engine*", "api_layer*", "helix_education*", "grounding_engine*", "observability*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",
    "E741",
    "F841",
    "F821",
    "F811",
    "F401",
    "W293",
    "W291",
]

[tool.ruff.lint.isort]
known-first-party = [
    "state_core",
    "learning_service",
    "content_engine",
    "quiz_engine",
    "progress_engine",
    "delivery_engine",
    "cognitive_engine",
    "grounding_engine",
    "api_layer",
    "helix_education",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that require live network access (skipped by default)",
    "performance: marks performance-oriented tests",
    "security: marks security-oriented tests",
]

[tool.bandit]
exclude_dirs = ["./build", "./dist", "./.venv", "./helix_education.egg-info", "./tests"]
skips = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pandas>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]
